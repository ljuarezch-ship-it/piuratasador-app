name: Crear APK PiuraTasador

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet y librerías
        run: pip install flet requests

      - name: Compilar APK
        run: flet build apk

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PiuraTasador-APK
          path: build/apk/*.apk
